plugins {
    id 'com.android.application'
}

// The gl4es static library is built out-of-band by deps/build-gl4es.sh,
// because gl4es declares cmake_minimum_required(VERSION 2.8.12) and needs
// the SDK's older CMake to configure at all.
def gl4esLib = file("${rootDir}/deps/src/gl4es/lib/libGL.a")

// The version is the repository's own, so a build cannot claim to be
// something it is not. scripts/version.sh prints "1.7.0-alpha.3 (abcd1234)";
// the commit belongs in the log rather than in a version name, and the
// script writes share/version.h as a side effect either way.
def gameVersion = {
    def out = new ByteArrayOutputStream()
    exec {
        commandLine 'sh', 'scripts/version.sh'
        workingDir file("${rootDir}/..")
        standardOutput = out
    }
    out.toString().trim().replaceAll(/\s*\(.*\)$/, '')
}()

// Release signing, if a key has been set up. See deps/../make-keystore.sh.
// Nothing here is ever committed: keystore.properties is in .gitignore, and
// without it a release build is simply left unsigned.
def keystoreProps = new Properties()
def keystoreFile = file("${rootDir}/keystore.properties")

if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'org.neverputt'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.neverputt'

        // Quest 2 runs Android 10; Horizon Store requires targetSdk 34.
        minSdk 29
        targetSdk 34

        versionCode 1
        versionName gameVersion

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab true
    }

    // Asset ZIPs are mounted in place out of the APK, so they must be
    // stored rather than deflated.
    androidResources {
        noCompress += ['zip']
    }


    signingConfigs {
        if (keystoreProps['storeFile']) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']

                // Signature scheme v3 carries the key's rotation history,
                // so this identity can be replaced later without orphaning
                // installs. It supersedes v2 rather than accompanying it,
                // and every device that meets minSdk understands it.
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false

            if (signingConfigs.findByName('release')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += "${rootDir}/deps/src/SDL/android-project/app/src/main/java"
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.62'
}

tasks.configureEach { task ->
    if (task.name.startsWith('externalNativeBuild')) {
        task.doFirst {
            if (!gl4esLib.exists()) {
                throw new GradleException(
                    "gl4es not built: ${gl4esLib}\n" +
                    "Run android/deps/fetch-deps.sh then android/deps/build-gl4es.sh.")
            }
        }
    }
}
